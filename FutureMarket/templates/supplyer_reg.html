<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supplyer Registration</title>
</head>
<body>
    <div> 
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            <h1>Supplyer Registration</h1>
            {% if messages %}
                {{ messages }}
            {% endif %}    
            
            <p>{{ form.errors }}</p>
            <p>{{ form.confirm_password.errors }}</p>
            <label for="sname">Supplyer Name</label>
            <input type="text" id="sname" placeholder="Enter supplyer name" name="supplyername" > <br>

            <label for="email">Working Email</label>
            <input type="email" id="email" name="email"> <br>
            
            <label for="pass">Password</label>
            <input type="text" id="pass" name="password" > <br>

            <label for="cpass">Confirm password</label>
            <input type="text" id="cpass" name="confirm_password" > <br>

            <button type="submit"> REGISTER </button>  
        </form>
     </div>  

</body>
</html>
